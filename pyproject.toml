[project]
name = "napalm-ros"
version = "1.6.0"
description = "Network Automation and Programmability Abstraction Layer driver for Mikrotik ROS"
readme = "README.md"
authors = [
    { name = "Łukasz Kostka", email = "lukasz.g.kostka@gmail.com" },
]
license = "GPL-2.0-or-later"
keywords = [
    "mikrotik",
    "routeros",
    "api",
    "napalm",
]
requires-python = ">=3.10.0"
dependencies = [
    "napalm>=5.0.0,<6.0.0",
    "librouteros~=4.2.2",
    "packaging>=23.0",
]

[project.urls]
Homepage = "https://github.com/napalm-automation-community/napalm-ros"
Issues = "https://github.com/napalm-automation-community/napalm-ros/issues"

[dependency-groups]
dev = [
    "pytest==9.*",
    "ruff==0.*",
    "uv>=0.11.16",
]

[build-system]
requires = ["uv_build==0.12.*"]
build-backend = "uv_build"

[tool.ruff]
line-length = 160

[tool.ruff.lint]
ignore = [
    "E712",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80
